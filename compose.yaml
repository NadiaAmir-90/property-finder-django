
services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db

    container_name: property_db

    environment:
      POSTGRES_DB: propertydb
      POSTGRES_USER: propertyuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "127.0.0.1:5442:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U propertyuser -d propertydb
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
